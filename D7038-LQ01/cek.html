<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Master Wiki</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div> </div>
    <h1>Little Master Wiki</h1>
    <div class="wiki-section"  style="background-color: black;border: 1px solid red;border-radius: 15px;">
        <div class="category" onclick="toggleSection('characterList')">
            Character <span id="characterArrow">\/</span>
        </div>
        <ul id="characterList" class="hidden">
            <li><a href="character.html?name=mikhail">Mikhail Cychael</a></li>
            <li><a href="character.html?name=alexandrina">Alexandrina Sebastian</a></li>
            <li><a href="character.html?name=athago">Athago Cruise</a></li>
            <li><a href="character.html?name=mei">Mei</a></li>
        </ul>

        <div class="category" onclick="toggleSection('itemList')">
            Item <span id="itemArrow">\/</span>
        </div>
        <ul id="itemList" class="hidden">
            <li>Item 1</li>
            <li>Item 2</li>
        </ul>

        <div class="category" onclick="toggleSection('locationList')">
            Location <span id="locationArrow">\/</span>
        </div>
        <ul id="locationList" class="hidden">
            <li>Location 1</li>
            <li>Location 2</li>
        </ul>

        <div class="category" onclick="toggleSection('equipmentList')">
            Equipment <span id="equipmentArrow">\/</span>
        </div>
        <ul id="equipmentList" class="hidden">
            <li>Equipment 1</li>
            <li>Equipment 2</li>
        </ul>

        <div class="category" onclick="toggleSection('enemyList')">
            Enemy <span id="enemyArrow">\/</span>
        </div>
        <ul id="enemyList" class="hidden">
            <li>Enemy 1</li>
            <li>Enemy 2</li>
        </ul>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
